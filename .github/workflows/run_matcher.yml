name: Sheet Matcher Automation

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日日本時間 8:00
  workflow_dispatch:
    inputs:
      match_threshold:
        description: 'あいまい一致として採用する類似度（%）'
        default: '95'
      review_threshold:
        description: '要確認として候補を出す類似度（%）'
        default: '85'

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread pandas rapidfuzz google-auth

      - name: Run script
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MASTER_SHEET_ID: ${{ secrets.MASTER_ID }}
          PRICE_SHEET_ID: ${{ secrets.PRICE_ID }}
          # 追加の買取価格表（figure-kaitori-bot の千葉鑑定団船橋のシート）。未設定なら飛ばす
          CHIBAKAN_PRICE_ID: ${{ secrets.CHIBAKAN_PRICE_ID }}
          MATCH_THRESHOLD: ${{ inputs.match_threshold || '95' }}
          REVIEW_THRESHOLD: ${{ inputs.review_threshold || '85' }}
        run: |
          python jan_price_matcher.py
